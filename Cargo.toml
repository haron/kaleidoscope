[package]
name = "webcam"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.38"
config = "0.14.0"
glob = "0.3.1"
jpeg-decoder = "0.3.1"
lazy_static = "1.4.0"
macroquad = "0.4.5"
serde = { version = "1.0.203", features = ["derive"] }
v4l = "0.14.0"

# fat LTO: faster JPEG decode on the 2-core Celeron
[profile.release]
lto = "fat"
codegen-units = 1
